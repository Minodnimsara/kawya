<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kawya Group</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><style>
:root{box-sizing:border-box;--bg:#f6f5f0;--panel:#f6f5f0;--card:#fff;--soft:#f4f3ee;--ink:#1c1b2e;--mut:#8f8e9c;--ln:#eceae4;--lime:#d9f27b;--lime2:#c8e65a;--yel:#f5b83d;--navy:#1e1d2d;--peach:#fde0d2;--barc:#1e1d2d;--ok:#2f9e5b;--bad:#d2541b;--shadow:rgba(0,0,0,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1e2227;--panel:#252a31;--card:#2d333b;--soft:#353c45;--ink:#dfe3e8;--mut:#9aa4af;--ln:#3b434d;--lime:#bfd77a;--lime2:#adc666;--yel:#d9a94f;--navy:#1a1e23;--peach:#4a3d36;--barc:#7f93b8;--ok:#6dbb8a;--bad:#e08a62;--shadow:rgba(0,0,0,0)}}
:root[data-theme=dark]{--bg:#1e2227;--panel:#252a31;--card:#2d333b;--soft:#353c45;--ink:#dfe3e8;--mut:#9aa4af;--ln:#3b434d;--lime:#bfd77a;--lime2:#adc666;--yel:#d9a94f;--navy:#1a1e23;--peach:#4a3d36;--barc:#7f93b8;--ok:#6dbb8a;--bad:#e08a62;--shadow:rgba(0,0,0,0)}

@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tile,:root:not([data-theme=light]) .as em,:root:not([data-theme=light]) .tg,:root:not([data-theme=light]) .bdg{filter:saturate(.75) brightness(.86)}:root:not([data-theme=light]) .avs{filter:saturate(.8) brightness(.9)}}
:root[data-theme=dark] .tile,:root[data-theme=dark] .as em,:root[data-theme=dark] .tg,:root[data-theme=dark] .bdg{filter:saturate(.75) brightness(.86)}:root[data-theme=dark] .avs{filter:saturate(.8) brightness(.9)}
*{box-sizing:border-box}
body{margin:0;padding:clamp(8px,3vw,48px);font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
.app{max-width:1440px;margin:auto;background:var(--panel);border-radius:40px;padding:22px;display:grid;grid-template-columns:238px minmax(0,1fr);gap:28px;align-items:start;box-shadow:0 40px 60px -35px var(--shadow)}
.side{background:var(--navy);color:#fff;border-radius:28px;padding:22px 16px 16px;position:sticky;top:14px;display:flex;flex-direction:column;min-height:calc(100vh - 100px);max-height:calc(100vh - 28px);overflow-y:auto;scrollbar-width:none}
.logo{display:flex;align-items:center;gap:10px;font:700 24px Inter,system-ui,sans-serif;margin:2px 6px 30px}
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 8px 22px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.pav{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#e6ea72,#f0b93f);display:grid;place-items:center;font:700 28px Inter,system-ui,sans-serif;color:#1c1b2e;margin-bottom:14px}
.prof b{font:700 17px Inter,system-ui,sans-serif;color:#fff}
.prof small{margin-top:5px;font:500 11.5px Inter,system-ui,sans-serif;color:#a9a8bb;line-height:1.4}
.prof{cursor:pointer;border-radius:20px}.prof:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.pav{position:relative;transition:transform .15s}.prof:hover .pav{transform:scale(1.04)}
.pk{position:absolute;right:-3px;bottom:-3px;width:30%;height:30%;min-width:20px;min-height:20px;border-radius:50%;background:#fff;color:#1c1b2e;border:3px solid var(--navy);display:grid;place-items:center}.pk.on{background:var(--lime)}.pk svg.i{width:62%;height:62%;stroke-width:2}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:10px 0 6px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{border:0;background:none;display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-radius:18px;font:600 14px Inter,system-ui,sans-serif;color:#d3d1e6;cursor:pointer;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--lime);color:#1c1b2e}
.bdg{margin-left:auto;background:#fcd9c8;color:#a4400f;border-radius:10px;font:700 11px Inter,system-ui,sans-serif;padding:3px 8px}
.dl{margin-top:auto;background:var(--lime);color:#1c1b2e;border-radius:24px;padding:62px 16px 16px;text-align:center;position:relative;overflow:hidden;font-weight:700;font-size:14px;line-height:1.3}
.dl:before{content:"";position:absolute;right:-18px;top:-18px;width:92px;height:150px;background:repeating-linear-gradient(#1c1b2e22 0 5px,transparent 5px 12px);border-radius:12px}
.dl .arr{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid #1c1b2e;display:grid;place-items:center;cursor:pointer;color:#1c1b2e;padding:0}
.mn{min-width:0;padding:4px 2px 0}
.top{display:flex;gap:14px;align-items:center;margin-bottom:26px;flex-wrap:wrap}
.tl{margin-right:auto;min-width:0;flex:1}.top{flex-wrap:nowrap}.tl h1{margin:0;font-size:clamp(20px,2vw,28px);font-weight:700;white-space:nowrap}.tl p{margin:4px 0 0;color:var(--mut);font-size:13px}.tl p:empty{display:none}
.ib{position:relative}.ib.dot::after{content:"";position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--yel);border:2px solid var(--card)}
.nt{background:var(--soft);border-radius:18px;padding:14px;margin-bottom:8px;font-size:13px;cursor:pointer}.nt b{display:block;margin-bottom:2px}.nt small{color:var(--mut)}
.dl .bk{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;border:0;background:#1c1b2e;color:#fff;border-radius:14px;padding:9px 10px;font:700 12px Inter,system-ui,sans-serif;cursor:pointer;position:relative}
.tr{display:flex;gap:10px;align-items:center;flex:none}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:30px;padding:0 16px;border:1px solid var(--ln);width:230px;color:var(--mut)}
.srch input{border:0;background:none;padding:12px 0;border-radius:0;box-shadow:none!important}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;flex:none}
.add{background:var(--lime);color:#1c1b2e;border:0;border-radius:30px;padding:12px 18px;font:700 13px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.avs{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--lime),var(--yel));display:grid;place-items:center;font:700 13px Inter,system-ui,sans-serif;color:#1c1b2e;flex:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,select{font:500 14px Inter,system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:11px 13px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--lime2);box-shadow:0 0 0 3px rgba(200,230,90,.35)}
button.b,button.g{border-radius:30px;padding:11px 20px;font:700 13px Inter,system-ui,sans-serif;cursor:pointer;border:1px solid transparent}
button.b{background:var(--lime);color:#1c1b2e}button.b:hover{background:var(--lime2)}
button.g{background:var(--card);color:var(--ink);border-color:var(--ln)}
button.s{padding:6px 14px;font-size:12px}
.card{background:var(--card);border-radius:26px;padding:22px;margin-bottom:16px}
h2,h3{margin:0 0 14px}h2{font-size:22px}h3{font-size:19px}.mu{color:var(--mut)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.k{cursor:pointer;margin:0;background:var(--soft)}.k b{font-size:34px;display:block}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;margin-bottom:14px}
label{font:600 12px Inter,system-ui,sans-serif;color:var(--mut);display:flex;flex-direction:column;gap:5px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;font-size:12px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
tr:last-child td{border-bottom:0}
.tg{display:inline-block;border-radius:20px;padding:4px 12px;font:700 11px Inter,system-ui,sans-serif;background:#e1f3a6;color:#3b5a00}
.tg.bad{background:#fde0d2;color:#a4400f}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tb{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mb{position:fixed;inset:0;background:rgba(20,16,40,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9;overflow:auto}
.mc{background:var(--panel);color:var(--ink);border-radius:30px;padding:26px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
pre{font:13px/1.35 "Courier New",monospace;white-space:pre-wrap;margin:0 0 12px}
/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.sh{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.sh h2{margin:0}
.la{color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline}
.pl{width:30px;height:30px;border-radius:50%;border:0;background:var(--lime);color:#1c1b2e;font:700 18px Inter,system-ui,sans-serif;cursor:pointer;line-height:1}
.cc3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cc{background:var(--card);border-radius:22px;padding:16px;cursor:pointer;transition:transform .15s}.cc:hover{transform:translateY(-3px)}
.ch1{display:flex;gap:12px;align-items:center;margin-bottom:18px}.ch1 b{display:block;font-size:15px}.ch1 small,.cm small{color:var(--mut);font-size:12px;display:block}
.tile{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#1c1b2e;flex:none}.tile.sm{width:38px;height:38px;border-radius:12px}
.cm{display:grid;grid-template-columns:auto 1fr;gap:22px}.cm b{font-size:13px}
.mid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin:22px 0 24px}.mid .card{margin:0}
.ctop{display:flex;justify-content:space-between;align-items:flex-start}
.pill{border:1px solid var(--ln);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.trn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:4px}.trn span.ar{width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;color:var(--ink)}.trn b{color:var(--ok)}.trn b.dn{color:var(--bad)}
.chart{display:flex;gap:8px;height:200px;margin-top:44px}
.yl{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--mut);padding-bottom:26px;margin-top:-7px;min-width:26px}
.plot{flex:1;display:flex;flex-direction:column;min-width:0}
.pa{position:relative;flex:1;background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/100% 25%;border-bottom:1px solid var(--ln);display:flex}
.bar{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;height:100%}
.bar i{width:7px;border-radius:5px;background:var(--barc);min-height:3px}
.bar.hl i{background:var(--lime);width:9px}
.tip{position:absolute;top:-4px;left:50%;transform:translate(-50%,-100%);background:var(--navy);color:#fff;padding:6px 10px;border-radius:10px;font:700 11px Inter,system-ui,sans-serif;white-space:nowrap;display:none;z-index:2;line-height:1.35}
.tip small{opacity:.7;font-weight:500}
.bar:last-child .tip{transform:translate(-78%,-100%)}
.bar.hl .tip{display:block}.pa:hover .bar.hl .tip{display:none}.pa .bar:hover .tip{display:block}
.xl{display:flex;height:26px;font-size:11px;color:var(--mut)}.xl span{flex:1;text-align:center;padding-top:8px}
.jr{display:flex;align-items:center;gap:12px;padding:9px 0;cursor:pointer}.jr b{display:block;font-size:14px}.jr small{color:var(--mut);font-size:12px}
.jr .go{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.cr{display:grid;grid-template-columns:50px minmax(0,1.6fr) 1fr 88px;gap:14px;align-items:center;background:var(--card);border-radius:22px;padding:12px 18px;margin-bottom:10px;cursor:pointer}
.cr b{display:block;font-size:14px}.cr small{color:var(--mut);font-size:12px;display:block}.cr .rm small{margin-bottom:2px}
.rg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;justify-content:flex-end}.rg svg{width:28px;height:28px}
.empty{background:var(--card);border-radius:22px;padding:22px;text-align:center;color:var(--mut)}
.promo{background:var(--navy);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden;min-height:158px;margin-bottom:18px}
.promo .pm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:10px}
.promo h3{font-size:22px;margin:0 0 6px}.promo p{font-size:11px;opacity:.7;max-width:150px;margin:0 0 14px;line-height:1.45}
.promo svg.art{position:absolute;right:6px;bottom:4px;width:124px}
.cal .chh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:700;font-size:15px}
.ar2{border:0;background:var(--soft);color:var(--ink);border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:16px}
.wh,.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wh{background:var(--soft);border-radius:10px;padding:7px 0;margin-bottom:8px;font-size:11px;font-weight:700}
.cg{row-gap:4px;font-size:12px;font-weight:600}
.cg span{position:relative;display:grid;place-items:center;width:30px;height:30px;margin:auto;border-radius:50%}
.cg span.of{color:var(--mut);opacity:.5}.cg span.td{background:var(--lime);color:#1c1b2e;font-weight:700}
.cg i{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--yel)}
.as{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.as b{display:block;font-size:13px}.as small{color:var(--mut);font-size:11px}
.as em{margin-left:auto;font-style:normal;font:700 11px Inter,system-ui,sans-serif;padding:6px 12px;border-radius:20px;white-space:nowrap}
.side::-webkit-scrollbar{display:none}.side>*{flex-shrink:0}.nav{margin-bottom:18px}
.cs4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.sc{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sc.dk{background:var(--navy);color:#fff}
.sc .sl{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--mut)}
.sc .sn{font-size:clamp(22px,2.3vw,30px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.sc .sd{font-size:12px;color:var(--mut)}
.sc.dk .sl,.sc.dk .sd{color:#c9c7de}
.sc .tile{width:40px;height:40px}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ctl .srch{width:min(100%,300px);flex:0 1 300px}
.ctr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
select.ps{width:auto;border-radius:30px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer}
.ctr .b,.ctr .g{display:inline-flex;align-items:center;gap:6px;padding:10px 16px}
table.ct{border-collapse:separate;border-spacing:0}
.ct th{background:var(--soft);padding:12px 10px}
.ct th:first-child{border-radius:14px 0 0 14px}.ct th:last-child{border-radius:0 14px 14px 0}
.ct tr.rw{cursor:pointer}.ct tr.rw:hover td{background:var(--soft)}
.cn{display:flex;align-items:center;gap:10px}.cn b{font-size:13px}
.cav{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:700 11px Inter,system-ui,sans-serif;color:var(--ink);flex:none}
.ct tr.rw:hover .cav{background:var(--card)}
.ac{text-align:right}
.ico{width:32px;height:32px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;margin-left:4px}.ico:hover{background:var(--lime);color:#1c1b2e}.ico svg.i{width:16px;height:16px}
.pg{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--mut)}
.pgl,.pgr{display:flex;align-items:center;gap:6px}.pgl select.ps{padding:6px 10px;font-size:12px}
.pgb{min-width:30px;height:30px;border-radius:9px;border:0;background:var(--soft);color:var(--ink);font:600 12px Inter,system-ui,sans-serif;cursor:pointer}.pgb.on{background:var(--lime);color:#1c1b2e}.pgb:disabled{opacity:.4;cursor:default}
@media(max-width:700px){.hm{display:none}.ctr{margin-left:0;width:100%}.pg{justify-content:center}}
.tcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.tcard{background:var(--card);color:var(--ink);font:inherit;text-align:left;border:0;border-radius:24px;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 2px transparent;transition:transform .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-2px)}.tcard.on{box-shadow:inset 0 0 0 2px var(--lime2)}
.tcard .tch{display:flex;align-items:center;justify-content:space-between;gap:10px}.tcard .tile{width:36px;height:36px}
.tcw{font-size:12px;font-weight:600;color:var(--bad)}
.tcard .tn{font-size:32px;font-weight:700;line-height:1}
.tcard .tcf{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--mut)}
.tjl{container-type:inline-size}
.tj{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr) minmax(0,.95fr) minmax(0,1.3fr) minmax(112px,1fr) auto;grid-template-areas:"a b c d e f";gap:14px 14px;align-items:center;background:var(--card);border-radius:22px;padding:14px 20px;margin-bottom:10px}
.j1{grid-area:a}.j2{grid-area:b}.j3{grid-area:c}.j4{grid-area:d}.j5{grid-area:e}.j6{grid-area:f}
.tj small{display:block;color:var(--mut);font-size:12px}.tj b{display:block;font-size:14px;font-weight:600}
.tj .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}.tj .nm b{display:inline;font-size:15px;font-weight:700}
.tj .pn{display:flex;align-items:center;gap:5px;margin-top:2px;min-width:0}.tj .pn svg.i{width:13px;height:13px;color:var(--mut)}.tj .pn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dts{display:flex;align-items:center;gap:10px;margin-top:3px;color:var(--mut)}.dts .d b{font-size:18px;line-height:1.05;font-weight:700;color:var(--ink)}.dts .d small{font-size:12px}
.j4{display:grid;grid-template-columns:1fr 1fr;gap:10px}.j4>div,.j5{min-width:0}.j5 b{white-space:nowrap;font-size:13px}.j4{gap:8px}
.sg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-top:4px}.sg.ok svg{color:var(--ok)}.sg.wn svg{color:var(--bad)}.sg.go svg{color:var(--barc)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--ok)}.dot.wn{background:var(--yel)}
.j6{display:flex;flex-direction:column;gap:6px;align-items:stretch}.j6 button{white-space:nowrap}
@container (max-width:1000px){.tj{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"a a b" "c d e" "f f f"}.j6{flex-direction:row;flex-wrap:wrap}}
@container (max-width:540px){.tj{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"a a" "b c" "d d" "e e" "f f"}}
