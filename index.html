<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Kawya Group</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
:root{--bg:#c9c9c1;--panel:#f8f7f2;--card:#fff;--soft:#f3f2ea;--ink:#161616;--mut:#9b9b93;--ln:#e9e8de;--lime:#d9f36b;--limeD:#c9e655;--limeInk:#1b2400;--yel:#f3b63f;--dark:#171717;--ok:#2e9b5c;--bad:#e0572b;--blue:#d5e3f8;--cream:#fff1bd;--rose:#ffe1d6;--btn:#161616;--btnInk:#fff}
:root[data-theme=dark]{--bg:#0f0f0e;--panel:#1b1b18;--card:#252521;--soft:#2e2e29;--ink:#f3f2ea;--mut:#8e8e85;--ln:#393932;--dark:#0b0b0a;--blue:#2b3a52;--cream:#463d1c;--rose:#4a2c22;--btn:#f3f2ea;--btnInk:#161616}
html{scroll-padding-top:20px}
body{margin:0;padding:clamp(8px,2vw,28px);font-family:Urbanist,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:1520px;margin:auto;display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* sidebar */
.side{background:var(--card);border-radius:34px;padding:26px 16px 16px;position:sticky;top:clamp(8px,2vw,28px);min-height:min(880px,calc(100vh - 56px));display:flex;flex-direction:column}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font:800 19px Urbanist}
.logo svg{width:34px;height:34px}
.me{text-align:center;margin:20px 0 22px}
.av{width:92px;height:92px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(145deg,var(--lime),var(--yel));display:grid;place-items:center;font:800 30px Urbanist;color:#1b1b1b}
.nm{font:700 17px Urbanist;display:flex;align-items:center;justify-content:center;gap:4px}
.nm svg{width:14px;height:14px;color:var(--mut)}
.me small{color:var(--mut);font-size:11.5px;font-weight:500;display:block;margin-top:2px}
#nav button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-radius:14px;background:none;color:var(--ink);font:600 14px Urbanist;cursor:pointer;text-align:left;margin-bottom:3px}
#nav button svg{color:var(--mut)}
#nav button:hover{background:var(--soft)}
#nav button.on{background:var(--lime);color:var(--limeInk);font-weight:700}
#nav button.on svg{color:var(--limeInk)}
#nav em{margin-left:auto;font:700 10px Urbanist;font-style:normal;background:var(--yel);color:#1b1b1b;border-radius:10px;padding:2px 7px}
.help{margin-top:auto;position:relative;background:var(--dark);color:#fff;border-radius:26px;padding:40px 16px 18px;text-align:center;overflow:hidden}
.help .q{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:42px;height:42px;border-radius:0 0 21px 21px;background:var(--lime);color:var(--limeInk);display:grid;place-items:center;font:800 17px Urbanist}
.help b{font-size:16px}.help p{margin:4px 0 12px;font-size:11.5px;color:#b9b9b0}
.help button{background:#fff;color:#111;border:0;border-radius:10px;padding:8px 14px;font:700 12px Urbanist;cursor:pointer;position:relative}
.help svg.dd{position:absolute;left:0;bottom:0;width:100%;height:50px;opacity:.35;pointer-events:none}
/* panel and top bar */
.panel{background:var(--panel);border-radius:38px;padding:24px 28px 32px;min-height:calc(100vh - 56px);min-width:0}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.tabs{display:flex;gap:22px;align-items:center;margin-right:auto;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;font:600 15px Urbanist;color:var(--mut);padding:6px 0;cursor:pointer;display:flex;gap:7px;align-items:center}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab svg{width:16px;height:16px}
.srch{position:relative;width:min(300px,100%);color:var(--mut)}
.srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px}
input,select{font:500 14px Urbanist;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:11px 13px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--ink)}
.srch input{padding-left:36px;background:transparent}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);font:600 12px Urbanist;padding:6px 11px;border-radius:10px;display:flex;gap:5px;align-items:center;cursor:pointer}
.seg svg{width:13px;height:13px}
:root:not([data-theme=dark]) .seg .lt,:root[data-theme=dark] .seg .dk{background:var(--lime);color:var(--limeInk)}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--ink);cursor:pointer;position:relative;display:grid;place-items:center}
.ib:hover{background:var(--soft)}
.ib .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--yel);display:none}
.b,.g,.d{border-radius:30px;padding:10px 18px;font:700 13px Urbanist;cursor:pointer;border:0;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.b{background:var(--lime);color:var(--limeInk)}.b:hover{background:var(--limeD)}
.g{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.d{background:var(--btn);color:var(--btnInk);border-radius:14px;padding:12px 20px;font-size:14px}
.s{padding:6px 14px;font-size:12px}
.d svg{width:16px;height:16px}
/* content */
.ph h1{font-size:38px;line-height:1.05;margin:0 0 6px;font-weight:700}
.ph p{color:var(--mut);margin:0 0 22px;font-size:15px}
.card{background:var(--card);border-radius:28px;padding:22px;margin-bottom:18px}
.card h2,.card h3{margin:0 0 14px}
.mu{color:var(--mut)}
.hero-row{display:grid;grid-template-columns:minmax(260px,400px) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-size:clamp(34px,4vw,48px);line-height:1.06;margin:0 0 14px;font-weight:700}
.hero .hl{color:var(--yel)}
.hero p{color:var(--mut);font-size:15.5px;margin:0;max-width:340px}
.cards{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 8px}
.mini{flex:0 0 148px;background:var(--card);border-radius:26px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:0;text-align:left;font-family:inherit;color:inherit}
.mini:hover{transform:translateY(-2px)}
.mini svg{width:100%;height:112px}
.mini b{font-size:15px}.mini span{color:var(--mut);font-size:12px;font-weight:500}
.mini.new{background:transparent;border:1.5px dashed var(--mut);align-items:center;justify-content:center}
.mini.new i{width:30px;height:30px;border-radius:9px;background:var(--lime);color:var(--limeInk);display:grid;place-items:center}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;margin-top:24px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.ring{background:var(--card);border-radius:24px;padding:16px;display:grid;grid-template-columns:62px 1fr;gap:6px 12px;align-items:center}
.ring small{display:block;font:700 10px Urbanist;color:var(--yel);text-transform:uppercase;letter-spacing:.05em}
.ring b{font-size:16px}
.ring .ft{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:11.5px;color:var(--mut);margin-top:8px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.sh h3{margin:0;font-size:20px}.sh a{color:var(--mut);font-size:13px;cursor:pointer;font-weight:600}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tk{border-radius:22px;padding:18px;background:var(--soft);min-height:134px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;cursor:pointer}
.tk.dk{background:var(--dark);color:#fff;box-shadow:0 16px 26px -14px rgba(0,0,0,.5)}
.tk .t1{display:flex;justify-content:space-between;gap:12px;font:700 16px/1.3 Urbanist}
.tk .t2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:600}
.lv{font:600 11px Urbanist;border-radius:20px;padding:5px 12px;height:fit-content;background:var(--rose);color:#7a2c10;white-space:nowrap}
.dk .lv{background:rgba(255,255,255,.88);color:#222}
.pl{display:inline-block;padding:7px 14px;border-radius:12px;font:600 12px Urbanist;color:#222}
.pl.cr{background:var(--cream)}.pl.bl{background:var(--blue)}.pl.ro{background:var(--rose)}.pl.lm{background:var(--lime)}
:root[data-theme=dark] .pl{color:#f3f2ea}
.row{display:grid;grid-template-columns:44px minmax(120px,1.2fr) 118px minmax(120px,1.3fr) auto;gap:14px;align-items:center;background:var(--soft);border-radius:20px;padding:12px 16px;margin-bottom:10px}
.row .th{width:44px;height:44px;border-radius:14px;background:var(--lime);color:var(--limeInk);display:grid;place-items:center}
.row small{display:block;color:var(--mut);font-size:11.5px}
.row .am small{text-transform:uppercase;font-size:10px;letter-spacing:.04em}
.bar2{height:5px;border-radius:5px;background:var(--ln);overflow:hidden;margin-top:5px}
.bar2 i{display:block;height:100%;background:var(--yel);border-radius:5px}
.add{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--ln);border-radius:20px;padding:16px;font-weight:700;cursor:pointer;background:none;color:var(--ink);width:100%;font-family:inherit;font-size:14px}
.add i{width:24px;height:24px;border-radius:8px;background:var(--lime);color:var(--limeInk);display:grid;place-items:center}
.add svg{width:14px;height:14px}
.chead{display:flex;align-items:center;justify-content:space-between}
.chead h3{margin:0;font-size:22px}
.arr{display:flex;gap:6px}
.arr button{width:28px;height:28px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;color:var(--ink);display:grid;place-items:center}
.arr svg{width:14px;height:14px}
.wkd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px;margin:18px 0 8px;font-size:11px;color:var(--mut);font-weight:600}
.wkd div{display:flex;flex-direction:column;align-items:center;gap:6px}
.wkd span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px Urbanist;color:var(--ink);position:relative}
.wkd .td span{background:var(--yel);color:#1b1b1b}
.wkd span i{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.ev{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1.5px dotted var(--ln)}
.ev .ec{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.ev .ec svg{width:16px;height:16px}
.ev b{font-size:13.5px;display:block}.ev small{color:var(--mut);font-size:11.5px}
.nt{background:var(--soft);border-radius:20px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.nt b{font-size:14px;display:block}.nt p{margin:3px 0 6px;color:var(--mut);font-size:12.5px}.nt small{color:var(--mut);font-size:11.5px;font-weight:600}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kp{background:var(--soft);border-radius:22px;padding:18px}
.kp b{font-size:24px;display:block;margin-bottom:2px}.kp span{color:var(--mut);font-size:13px;font-weight:600}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:end;margin-bottom:14px}
label{font:600 12px Urbanist;color:var(--mut);display:flex;flex-direction:column;gap:5px}
.w{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:700 11px Urbanist;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:8px 10px;white-space:nowrap}
td{text-align:left;padding:12px 10px;border-top:1px solid var(--ln);white-space:nowrap}
.tg{display:inline-block;border-radius:20px;padding:4px 11px;font:700 11px Urbanist;background:var(--soft)}
.tg.ok{background:rgba(46,155,92,.16);color:var(--ok)}.tg.bad{background:rgba(224,87,43,.15);color:var(--bad)}.tg.wn{background:var(--cream)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.btot{font-size:34px;margin:6px 0 16px}
.sec{font-size:14px;font-weight:700;margin:6px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.mb{position:fixed;inset:0;background:rgba(15,15,10,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;overflow:auto}
.mc{background:var(--card);border-radius:30px;padding:26px;max-width:680px;width:100%;max-height:92vh;overflow:auto}
.mc h2{margin:0 0 12px}
.mc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
pre#pb{font:13px/1.35 "Courier New",monospace;white-space:pre;overflow-x:auto;margin:0 0 12px;background:#fff;color:#000;padding:14px;border-radius:14px;border:1px solid var(--ln)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:#161616;color:#fff;padding:12px 20px;border-radius:30px;font:600 13px Urbanist;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@page{size:9.5in 5.5in;margin:6mm}
@media print{
 body *{visibility:hidden}
 #pb,#pb *{visibility:visible}
 body{padding:0;background:#fff}
 .mb{position:static;display:block;padding:0;background:none;overflow:visible;backdrop-filter:none}
 .mc{max-height:none;overflow:visible;background:none;padding:0}
 #pb{position:absolute;left:0;top:0;color:#000!important;background:#fff!important;font-size:11pt;border:0;padding:0;overflow:visible}
}
@media(max-width:1180px){.dash{grid-template-columns:1fr}.hero-row{grid-template-columns:1fr}.rings{grid-template-columns:1fr}}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:static;min-height:0;padding:12px;border-radius:26px}
 .logo,.me,.help{display:none}
 #nav{display:flex;overflow-x:auto;gap:4px}
 #nav button{width:auto;white-space:nowrap;margin:0;flex:none}
 .panel{padding:18px 14px 26px;border-radius:28px}
 .row{grid-template-columns:44px 1fr auto}.row .pg,.row .am{display:none}
 .ph h1{font-size:30px}
}

 `<div class="card"><h3>Salary payments</h3>${tbl(['Date','Worker','Earned','Advance cut','Paid'],O(S.pay.slice(-15).reverse(),p=>tr([p.d,E(p.w),f(p.g),f(p.ded),f(p.net)])),'No payments yet.')}</div>`},

  S.cu[k]={n:nm,i:b.c.i,p:pn,a:b.c.a,since:S.cu[k]?S.cu[k].since:D()};S.bl.push(b);P();B=[];go('bill');showBill(b)};
 if(lw.length)return sure('Stock is lower than the quantity for: '+lw.map(i=>E(i.n)).join(', ')+'. Continue anyway?',make);
 make()}
const txt=b=>{const w=74,Ln='-'.repeat(w),r=(s,n)=>String(s).padStart(n),l=(s,n)=>String(s).padEnd(n).slice(0,n),o=[l('KAWYA GROUP',40)+'BILL '+b.no,'Concrete Yard | Hardware | Transport',l('',40)+'Date: '+b.d+' '+(b.t||''),Ln,'Customer: '+b.c.n,'NIC: '+(b.c.i||'-')+'   Phone: '+b.c.p,'Address: '+(b.c.a||'-'),'Section: '+b.dv,Ln,l('Item',34)+r('Qty',6)+r('Price',14)+r('Amount',16),Ln];b.it.forEach(i=>o.push(l(i.n,34)+r(i.q,6)+r(i.p.toFixed(2),14)+r((i.q*i.p).toFixed(2),16)));o.push(Ln);if(b.dc)o.push(r('Discount: -'+b.dc.toFixed(2),w));o.push(r('TOTAL: '+f(b.total),w),r('Paid: '+f(pd(b)),w),r('BALANCE DUE: '+f(bal(b)),w),Ln,'Payment: '+b.m+(b.ch?' (Cheque '+b.ch.no+', '+b.ch.b+')':''),'Our transport: '+(b.tr=='No'?'No':'Yes'),'Goods once sold will not be taken back. Thank you!');return o.join('\n')};
