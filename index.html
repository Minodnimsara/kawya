body{margin:0;padding:14px;font-family:Urbanist,system-ui,sans-serif;color:var(--ink);background:var(--pg);background-attachment:fixed;background-color:var(--card)}

.side button.on{background:var(--acc);color:#fff}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:40px;padding:8px 10px;margin-bottom:14px;flex-wrap:wrap}
.top b{font-size:17px;padding:0 10px}
input,select{font:500 14px Urbanist;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px 12px;width:100%;box-sizing:border-box}
.top input{flex:1;min-width:150px;width:auto;border-radius:30px}
button.b,button.g{border-radius:30px;padding:10px 18px;font:700 13px Urbanist;cursor:pointer;border:1px solid var(--acc)}
button.b{background:var(--acc);color:#fff}button.g{background:var(--card);color:var(--ink);border-color:var(--ln)}
button.s{padding:6px 12px;font-size:12px}
.card{background:var(--gl);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:32px;padding:20px;border:1px solid rgba(255,255,255,.5);margin-bottom:14px}
h2,h3{margin:0 0 12px}.mu{color:var(--mut)}
.hero h1{font-size:clamp(42px,9vw,96px);line-height:.95;margin:20px 0 10px;color:rgba(255,255,255,.8);font-weight:700}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.k{cursor:pointer;margin:0}.k b{font-size:44px;display:block}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;margin-bottom:12px}
label{font:600 12px Urbanist;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.tg{display:inline-block;border-radius:20px;padding:3px 10px;font:700 11px Urbanist;background:var(--ln)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.tb{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mb{position:fixed;inset:0;background:rgba(20,16,50,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9;overflow:auto}
.mc{background:var(--card);border-radius:32px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
pre{font:13px/1.35 "Courier New",monospace;white-space:pre-wrap;margin:0 0 12px}
@page{size:9.5in 5.5in;margin:6mm}
@media print{body *{visibility:hidden}#pb,#pb *{visibility:visible}#pb{position:absolute;left:0;top:0;color:#000;font-size:11pt}}
@media(max-width:760px){.shell{grid-template-columns:1fr;border-radius:28px;padding:10px}.side{flex-direction:row;overflow-x:auto;position:static;border-radius:30px}.side button{min-width:62px}}
